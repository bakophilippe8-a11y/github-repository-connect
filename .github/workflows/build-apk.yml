name: Build APK

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Dépendances
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Synchroniser le projet Android
        run: npx cap sync android
        env:
          APP_URL: ${{ vars.APP_URL || 'https://localhost' }}

      - name: Clé de signature (si fournie)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          fi

      - name: Compiler l'APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
          APP_URL: ${{ vars.APP_URL || 'https://localhost' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$SIGNED" = "1" ]; then 
            ./gradlew assembleRelease --stacktrace
          else 
            ./gradlew assembleDebug --stacktrace
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: salesgenius-apk
          path: android/app/build/outputs/apk/**/*.apk
